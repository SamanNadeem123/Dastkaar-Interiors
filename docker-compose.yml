services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: na_furniture_valley
    volumes:
      - nafv_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Overrides .env's "localhost" so the backend reaches the db service by
      # its Compose network name rather than trying to hit its own container.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/na_furniture_valley
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - nafv_uploads:/app/static/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
        VITE_STORE_NAME: "NA Furniture Valley"
        VITE_WHATSAPP_NUMBER: "923000000000"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  nafv_db_data:
  nafv_uploads:
